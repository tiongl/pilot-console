<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="clip-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="eye-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background with border -->
  <rect x="4" y="4" width="120" height="120" rx="16" fill="url(#bg-grad)"/>
  <rect x="4" y="4" width="120" height="120" rx="16" stroke="url(#clip-grad)" stroke-width="2.5" fill="none"/>

  <!-- Single tall > prompt, vertically centered -->
  <path d="M28 28l20 36-20 36" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Clippy paperclip (beside prompt, vertically centered) -->
  <path d="M64 106V40a18 18 0 0 1 36 0v58a13 13 0 0 1-26 0V44a8 8 0 0 1 16 0v52"
        stroke="url(#clip-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Clippy eyes -->
  <ellipse cx="74" cy="32" rx="12" ry="13" fill="#1e1e2e"/>
  <ellipse cx="96" cy="32" rx="12" ry="13" fill="#1e1e2e"/>
  <ellipse cx="74" cy="32" rx="10" ry="11" fill="url(#eye-grad)">
    <animate attributeName="ry" values="11;0.5;0.5;11" keyTimes="0;0.4;0.5;0.6" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="96" cy="32" rx="10" ry="11" fill="url(#eye-grad)">
    <animate attributeName="ry" values="11;0.5;0.5;11" keyTimes="0;0.4;0.5;0.6" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Pupils (looking left toward the prompt) -->
  <circle cx="71" cy="34" r="4.5" fill="#1e1e2e"/>
  <circle cx="93" cy="34" r="4.5" fill="#1e1e2e"/>
  <!-- Eye highlights -->
  <circle cx="71" cy="28" r="3" fill="white" opacity="0.7"/>
  <circle cx="93" cy="28" r="3" fill="white" opacity="0.7"/>

  <!-- Eyebrows -->
  <path d="M66 23 Q74 17 82 23" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M86 23 Q94 17 102 23" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
