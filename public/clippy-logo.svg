<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Paperclip body with terminal aesthetic -->
  <defs>
    <linearGradient id="clip-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="eye-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#1e1e2e"/>
  <rect x="4" y="4" width="56" height="56" rx="14" stroke="url(#clip-grad)" stroke-width="2" fill="none"/>
  <!-- Paperclip shape -->
  <path d="M26 46V24a6 6 0 0 1 12 0v20a4 4 0 0 1-8 0V26a2 2 0 0 1 4 0v16"
        stroke="url(#clip-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Left eye -->
  <circle cx="24" cy="20" r="3" fill="url(#eye-grad)"/>
  <!-- Right eye -->
  <circle cx="40" cy="20" r="3" fill="url(#eye-grad)"/>
  <!-- Terminal cursor blink -->
  <rect x="20" y="50" width="8" height="3" rx="1" fill="#a78bfa" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Terminal prompt chevron -->
  <path d="M38 50l3 1.5-3 1.5" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
